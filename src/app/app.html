<header class="barra">
  <a class="marca" routerLink="/">Inventario</a>

  <!-- El menú cambia según el rol: "Usuarios" solo existe para SUPER-ADMIN-ROLE -->
  <nav aria-label="Menú principal">
    <ul>
      @if (auth.autenticado()) {
      <li><a routerLink="/productos" routerLinkActive="activo" ariaCurrentWhenActive="page">Productos</a></li>
      <li><a routerLink="/categorias" routerLinkActive="activo" ariaCurrentWhenActive="page">Categorías</a></li>
      @if (auth.esAdmin()) {
      <li><a routerLink="/usuarios" routerLinkActive="activo" ariaCurrentWhenActive="page">Usuarios</a></li>
      }
      } @else {
      <li><a routerLink="/login" routerLinkActive="activo" ariaCurrentWhenActive="page">Iniciar sesión</a></li>
      <li><a routerLink="/registro" routerLinkActive="activo" ariaCurrentWhenActive="page">Registrarse</a></li>
      }
    </ul>
  </nav>

  @if (auth.autenticado()) {
  <div class="sesion">
      <span>
        {{ auth.nombre() }}
        <span class="rol">{{ auth.esAdmin() ? 'Administrador' : 'Usuario' }}</span>
      </span>
    <button type="button" (click)="auth.logout()">Cerrar sesión</button>
  </div>
  }
</header>

<main>
  <router-outlet />
</main>
